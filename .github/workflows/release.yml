# Публикация в npm по тегу версии (v1.2.0). Проверки и сборку запускает prepublishOnly из package.json.
# Вход в npm — Trusted Publishing (OIDC): токена в репозитории нет, provenance npm добавляет сам.
# Разовая настройка на npmjs.com: @hintdata/js → Settings → Trusted Publisher → GitHub Actions,
# репозиторий hintdata/js, workflow release.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Релиз собирается с чистого npm ci, без кэша зависимостей.
          package-manager-cache: false
      - name: Тег совпадает с версией пакета
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "тег $GITHUB_REF_NAME, а в package.json $version"; exit 1; }
      - name: npm умеет Trusted Publishing (11.5.1 и новее)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)" || { echo "npm $(npm --version) не умеет Trusted Publishing"; exit 1; }
      - run: npm ci
      - run: npm publish
